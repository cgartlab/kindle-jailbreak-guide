# 越狱步骤清单（19 步）+ 偏离状态清单（11 个）
# 步骤 id 与 docs/01-越狱全流程.md 的锚点一一对应。
# 状态 id 与 recovery/*.md 的对应关系见 recovery/README.md。

步骤:
  - id: "01"
    标题: "查固件与型号"
    执行者: agent
    阶段: "0 准备"
    前置: null
    动作: "读 <盘符>:\system\version.txt（盘符以你的实际挂载为准），解析固件版本与型号"
    验证: "固件 <= 5.16.2.1.1"
    不匹配时: "S01"
    详细说明: "docs/01-越狱全流程.md#步骤-01"

  - id: "02"
    标题: "电量>=50% 并移除密码锁"
    执行者: human
    阶段: "0 准备"
    前置: null
    动作: "确保电量 >= 50%，最好插电；移除设备密码锁"
    验证: "手动确认"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-02"

  - id: "03"
    标题: "清除根目录 .bin 残留"
    执行者: agent
    阶段: "0 准备"
    前置: null
    动作: "删除 <盘符>:\*.bin（残留的更新包会干扰越狱）"
    验证: "根目录无 .bin 文件"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-03"

  - id: "04"
    标题: "全量备份设备"
    执行者: agent
    阶段: "0 准备"
    前置: null
    动作: "运行 scripts/backup-device.ps1 镜像整个 Kindle 盘到备份目录（越狱流程会清空用户存储）"
    验证: "备份目录存在且大小 > 100 MB"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-04"

  - id: "05"
    标题: "下载安装包"
    执行者: agent
    阶段: "0 准备"
    前置: null
    动作: "按 data/jailbreaks.yaml 的下载链接获取所有安装包到本机 scripts 同级目录"
    验证: "所有文件下载成功"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-05"

  - id: "06"
    标题: "校验安装包哈希与魔数"
    执行者: agent
    阶段: "0 准备"
    前置: null
    动作: "运行 scripts/verify-artifacts.ps1 对每个包做 sha256 与魔数校验"
    验证: "sha256 匹配 data/jailbreaks.yaml 的资产表；LanguageBreak.tar.gz 魔数为 gzip 1f 8b"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-06"

  - id: "07"
    标题: "解压安装包"
    执行者: agent
    阶段: "0 准备"
    前置: "06"
    动作: "tar -xzf LanguageBreak.tar.gz 得到 update_hotfix_languagebreak.bin 与 LanguageBreak 文件夹；解压其他 zip/xz 包"
    验证: "LanguageBreak\ 文件夹存在；.demo\boot.flag 存在；update_hotfix_languagebreak.bin 存在"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-07"

  - id: "08"
    标题: "进入演示模式"
    执行者: human
    阶段: "1 越狱"
    前置: "07"
    动作: "Kindle 主界面顶部时间区点出搜索栏，输入 ;enter_demo 回车，立刻长按电源键 7 秒选重启"
    验证: "设备重启后进入演示模式界面"
    不匹配时: "S04"
    详细说明: "docs/01-越狱全流程.md#步骤-08"

  - id: "09"
    标题: "绕过演示模式错误画面"
    执行者: human
    阶段: "1 越狱"
    前置: "08"
    动作: "对错误文字做秘密手势：两指并拢同时点击错误文字，紧接单指从右下角滑到左下角"
    验证: "屏幕顶部出现搜索栏"
    不匹配时: "S03"
    详细说明: "docs/01-越狱全流程.md#步骤-09"

  - id: "10"
    标题: "侧载内容 + 第一次拷入"
    执行者: human+agent
    阶段: "1 越狱"
    前置: "09"
    动作: ";demo 进配置菜单选 Sideload Content 插 USB，robocopy /E 拷 LanguageBreak\ 全部（含隐藏）到 F:\ 根"
    验证: "F:\.demo\boot.flag 存在；F:\jb 存在；F:\patchedUks.sqsh 存在"
    不匹配时: "S05"
    详细说明: "docs/01-越狱全流程.md#步骤-10"

  - id: "11"
    标题: "转售设备 + 第二次拷入（抢时间）"
    执行者: human+agent
    阶段: "1 越狱"
    前置: "10"
    动作: "弹出拔掉 USB，回配置菜单（再做手势+;demo）选 Resell Device，按下确认；当 Press the Power Button 画面出现立刻插回 USB 并 robocopy 第二次"
    验证: "第二次拷入完成后弹出，长按电源键直到重启"
    不匹配时: "S06"
    详细说明: "docs/01-越狱全流程.md#步骤-11"

  - id: "12"
    标题: "选简体中文触发漏洞"
    执行者: human
    阶段: "1 越狱"
    前置: "11"
    动作: "重启后出现语言选择界面（不是主界面），选 简体中文（右侧列表倒数第二，pseudot 上方）确认"
    验证: "重启过程中屏幕右上角出现白色日志文字"
    不匹配时: "S07"
    详细说明: "docs/01-越狱全流程.md#步骤-12"

  - id: "13"
    标题: "应用 hotfix"
    执行者: human
    阶段: "1 越狱"
    前置: "12"
    动作: ";uzb 启用 USB 访问；插 USB 拷 update_hotfix_languagebreak.bin 到 F:\ 根；弹出；;dsts 进设置选 更新您的 Kindle 确认"
    验证: "重启后回到正常主界面"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-13"

  - id: "14"
    标题: "验证越狱"
    执行者: agent
    阶段: "1 越狱"
    前置: "13"
    动作: "搜索栏输入 ;log 回车"
    验证: "屏幕右上角出现日志文字 = 桥接活跃"
    不匹配时: "S08"
    详细说明: "docs/01-越狱全流程.md#步骤-14"

  - id: "15"
    标题: "安装 MRPI + KUAL"
    执行者: human
    阶段: "2 装组件"
    前置: "14"
    动作: "解压 kual-mrinstaller.tar.xz 拷 extensions\ 与 mrpackages\ 到 F:\；解压 KUAL-coplate.tar.xz 拷 Update_KUALBooklet_*_install.bin 进 mrpackages\；弹出；;log mrpi 回车"
    验证: "屏幕出现 Hush, little baby...；重启后书库有 KUAL 条目"
    不匹配时: "S09"
    详细说明: "docs/01-越狱全流程.md#步骤-15"

  - id: "16"
    标题: "安装 KOReader"
    执行者: agent
    阶段: "3 装阅读器"
    前置: "15"
    动作: "解压 koreader-kindle-legacy-*.zip 得 koreader\ extensions\ launchpad\ 三目录拷到 F:\ 根（覆盖）；弹出"
    验证: "KUAL 菜单能看到 KOReader 入口"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-16"

  - id: "17"
    标题: "安装微信读书插件"
    执行者: agent+human
    阶段: "3 装阅读器"
    前置: "16"
    动作: "解压 weread.koplugin-*.zip 拷 weread.koplugin\ 进 F:\koreader\plugins\；弹出；启动 KOReader 验证工具菜单出现 微信读书"
    验证: "KOReader 工具菜单能看到 微信读书 条目"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-17"

  - id: "18"
    标题: "阻断 OTA"
    执行者: human
    阶段: "4 阻断 OTA"
    前置: "17"
    动作: "解压 BinaryRenamer.zip 拷 BinaryRenamer\ 进 F:\extensions\；弹出；KUAL 里选 BinaryRenamer -> Block OTA Updates -> Reboot"
    验证: "设置页 更新您的 Kindle 灰色或不可用（BinaryRenamer 已把 otaupd otav3 改名）"
    不匹配时: "S11"
    详细说明: "docs/01-越狱全流程.md#步骤-18"

  - id: "19"
    标题: "登录微信读书"
    执行者: human
    阶段: "5 登录"
    前置: "18"
    动作: "手机微信读书 App -> 我 -> 设置 -> 微信读书 Skill 获取 API Key；Kindle 上 KOReader -> 工具 -> 微信读书 -> 微信扫码登录；手机确认后 KOReader 里输入 4 位验证码"
    验证: "书架加载成功"
    不匹配时: null
    详细说明: "docs/01-越狱全流程.md#步骤-19"

状态:
  - id: "S01"
    名称: "固件不符"
    探测: "version.txt 固件 > 5.16.2.1.1"
    可能原因:
      - "设备已自动升级到新固件"
    补救:
      - "停止本流程"
      - "引导用户去 https://kindlemodding.org/jailbreak-wizard.html 查可用方案"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html"

  - id: "S02"
    名称: "无法读取固件"
    探测: "version.txt 读不到（USB 未挂载或 KOReader 运行中）"
    可能原因:
      - "KOReader 还在运行，USB 不挂载"
      - "USB 线或接口有问题"
    补救:
      - "先退出 KOReader 回原生主界面再插 USB"
      - "换 USB 线或接口"
      - "重启 Kindle"
    出处: "docs/01-越狱全流程.md#坑-3"

  - id: "S03"
    名称: "演示模式异常"
    探测: "屏幕有 本演示设备内容缺失或未联网 错误文字 + 无搜索栏"
    可能原因:
      - "第一次拷入之前是正常的中间态"
    补救:
      - "按秘密手势：两指并拢同时点击错误文字，紧接单指从右下角滑到左下角"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html"

  - id: "S04"
    名称: "演示模式进不去"
    探测: ";enter_demo 无反应"
    可能原因:
      - "电量过低"
      - "设备有密码锁"
    补救:
      - "在 F:\ 根目录建一个空文件叫 DONT_CHECK_BATTERY，然后输入 ;demo 而不是 ;enter_demo"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html Troubleshooting"

  - id: "S05"
    名称: "拷入静默失败"
    探测: "文件存在但 sha256 与源不符（Windows 文件锁导致静默写失败）"
    可能原因:
      - "Windows 文件锁"
    补救:
      - "删除目标文件再重新拷入"
      - "拷入后对每个文件做 sha256 复核"
    出处: "社区经验：qianjindelvdai/kindle-revive skill.md"

  - id: "S06"
    名称: "第二次拷入超时"
    探测: "已按电源键但盘符未出现"
    可能原因:
      - "Resell Device 后时机太慢"
      - "USB 已拔"
    补救:
      - "重启，重来步骤 11：Resell Device 一出现 Press the Power Button 画面立刻插 USB"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html"

  - id: "S07"
    名称: "语言选择界面未出现"
    探测: "重启后直接回主界面"
    可能原因:
      - "第二次拷入不完整"
    补救:
      - "重复步骤 9-11：手势 -> ;demo -> Resell Device -> 第二次拷入"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html"

  - id: "S08"
    名称: "越狱桥接不活跃"
    探测: ";log 无输出"
    可能原因:
      - "hotfix 未装或已失效"
    补救:
      - ";uzb -> 插 USB 拷 update_hotfix_languagebreak.bin 到 F:\ -> 弹出 -> ;dsts -> 更新您的 Kindle"
    出处: "https://kindlemodding.org/jailbreaking/Legacy/LanguageBreak.html"

  - id: "S09"
    名称: "书库没有 KUAL"
    探测: "MRPI 安装后书库无 KUAL 条目"
    可能原因:
      - "MRPI 包不完整"
      - "拷用了 PEKI 路线（本机不可用）"
    补救:
      - "确认拷的是 MRPI 路线（kual-mrinstaller.tar.xz）不是 PEKI 路线"
      - "重拷 MRPI 的 extensions\ 与 mrpackages\ 到 F:\ 根"
      - "重拷 Update_KUALBooklet_*_install.bin 到 mrpackages\"
      - ";log mrpi 重新触发安装"
    出处: "社区经验（PEKI 在本机静默失败）"

  - id: "S10"
    名称: "USB 认不到设备"
    探测: "插 USB 电脑无盘符"
    可能原因:
      - "KOReader 还在运行（KUAL 以无框架方式启动 KOReader，把 USB 存储服务停了）"
      - "USB 线或接口问题"
    补救:
      - "KOReader 顶部左上角 ≡ -> 拉到底 -> 退出 KOReader，回原生主界面再插 USB"
      - "换 USB 线或接口"
      - "重启 Kindle"
    出处: "https://kindlemodding.org/jailbreak-faq.html"

  - id: "S11"
    名称: "OTA 入口失效误判"
    探测: "设置页 更新您的 Kindle 灰色不可用"
    可能原因:
      - "BinaryRenamer 已经成功执行了阻断（otaupd -> otaupd~ otav3 -> otav3~）"
    补救:
      - "这是预期行为，不需要修复"
      - "要解除阻断：KUAL -> BinaryRenamer -> Restore OTA Updates"
    出处: "https://www.mobileread.com/forums/showthread.php?t=357438"
