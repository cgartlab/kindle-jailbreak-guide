镜像:
  gh_proxy: "https://gh-proxy.com/"
  状态: "已验证可用（实测下载 GitHub Release 资产，返回 gzip 魔数 1f 8b）"
  用法: "在 GitHub 下载链接前加 https://gh-proxy.com/"
