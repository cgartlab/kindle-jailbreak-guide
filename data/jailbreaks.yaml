      - 文件名: "LanguageBreak.tar.gz"
        版本标签: "1.0.1"
        下载链接: "https://github.com/notmarek/LanguageBreak/releases/download/1.0.1/LanguageBreak.tar.gz"
        大小字节: 163260
        sha256: "2D508D7E1F01F5FDF949005225258622F0EA3CADF28B20EC3E83B8174371B190"
