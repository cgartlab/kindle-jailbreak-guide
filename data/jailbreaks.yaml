        备注: "实机越狱成功用的版本。"
      - 文件名: "update_hotfix_languagebreak.bin"
        版本标签: "1.0.1"
        下载链接: null
        大小字节: 160930
        sha256: null
        魔数: "bin"
        备注: "越狱后持久化用。位于 LanguageBreak.tar.gz 解压后的根目录。"
