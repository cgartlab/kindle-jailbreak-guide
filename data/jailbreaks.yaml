      - "同一机型（PW3 / 5.16.2.1.1）有独立失败报告（jdfesa），反复卡 Demo Mode 循环；退路是 WinterBreak2"
      - "官方已标为 legacy / no-longer recommended，但对注册困难或商店不可达的设备仍是最优解"
      - "5.16.3+ 固件不支持（改 hard-float）"
